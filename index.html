<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Portal Login">
    <title>Student Portal - Login</title>
</head>

<body style="margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(135deg, #eef4ff, #dce9ff); color: #333;">

    <!-- Header -->
    <header style="background: #0d47a1; color: white; padding: 18px 8%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 3px 10px rgba(0,0,0,0.15);">

        <h1 style="margin: 0; font-size: 26px; font-weight: 700;">
            Student Portal
        </h1>

        <nav aria-label="Main navigation" style="display: flex; gap: 10px;">

            <a href="index.html"
               style="color: #0d47a1; background: white; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: bold;">
                LOGIN
            </a>

            <a href="register.html"
               style="color: white; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: bold;">
                REGISTER
            </a>

        </nav>
    </header>


    <!-- Main Content -->
    <main style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 50px 20px;">

        <section aria-labelledby="login-heading" style="width: 100%; max-width: 430px;">

            <form action="/login"
                  method="post"
                  style="background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.12);">

                <h2 id="login-heading"
                    style="text-align: center; color: #0d47a1; font-size: 30px; margin: 0 0 25px 0;">
                    Welcome Back
                </h2>

                <fieldset style="border: none; padding: 0; margin: 0;">

                    <legend style="font-size: 14px; color: #666; margin-bottom: 8px;">
                        Login details
                    </legend>

                    <p id="email"
                       style="color: #777; font-size: 14px; line-height: 1.5; margin: 0 0 25px 0;">
                        Please enter your email and password to log in.
                    </p>


                    <!-- Email -->
                    <p style="margin: 0 0 18px 0;">

                        <label for="login-email"
                               style="display: block; font-size: 14px; font-weight: 600; color: #444; margin-bottom: 7px;">
                            Email Address
                        </label>

                        <input type="email"
                               id="login-email"
                               name="email"
                               autocomplete="email"
                               placeholder="Enter your email"
                               required
                               style="width: 100%; padding: 13px 14px; border: 1px solid #d0d7e2; border-radius: 8px; font-size: 15px; outline: none; background: #fafcff; box-sizing: border-box;">
                    </p>


                    <!-- Password -->
                    <p style="margin: 0 0 18px 0;">

                        <label for="login-password"
                               style="display: block; font-size: 14px; font-weight: 600; color: #444; margin-bottom: 7px;">
                            Password
                        </label>

                        <input type="password"
                               id="login-password"
                               name="password"
                               autocomplete="current-password"
                               placeholder="Enter your password"
                               required
                               style="width: 100%; padding: 13px 14px; border: 1px solid #d0d7e2; border-radius: 8px; font-size: 15px; outline: none; background: #fafcff; box-sizing: border-box;">
                    </p>


                    <!-- Remember Me -->
                    <div style="display: flex; align-items: center; gap: 8px; margin: 5px 0 22px 0;">

                        <input type="checkbox"
                               id="remember"
                               name="remember"
                               value="yes"
                               style="width: 16px; height: 16px; cursor: pointer;">

                        <label for="remember"
                               style="font-size: 14px; color: #444; cursor: pointer;">
                            Remember me
                        </label>

                    </div>


                    <!-- Login Button -->
                    <button type="submit"
                            style="width: 100%; padding: 13px; border: none; border-radius: 8px; background: #0d47a1; color: white; font-size: 16px; font-weight: bold; cursor: pointer;">
                        Log In
                    </button>

                </fieldset>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer style="text-align: center; padding: 18px; background: #083b83; color: rgba(255,255,255,0.85); font-size: 13px;">

        <p style="margin: 0;">
            &copy; 2026 Student Portal. All rights reserved.
        </p>

    </footer>

</body>
</html>
```
